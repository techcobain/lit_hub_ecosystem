name: Validate ecosystem

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate ecosystem data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --test test/ecosystem.test.mjs
      - run: npm run validate:ecosystem
      - run: node scripts/build-ecosystem.mjs
